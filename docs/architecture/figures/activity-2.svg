<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" role="img" aria-label="Two multipliers decay with days since a folder was last modified. The search ranking boost falls from 1.25 to 1.09 at 60 days and about 1.0 by a year. The featured-article weight falls from 1 to 0.37 at 60 days and 0.05 at 180 days." width="720" height="296">
<style>
.bg { fill: #fffefb; }
.bx { fill: #f7f5f0; stroke: rgba(28,27,24,0.2); stroke-width: 1.2; }
