<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 432" role="img" aria-label="Layered import graph at 4e9bece. app, entry files and scripts at the top; components and fourteen client islands in the middle; lib at the bottom in three parts: server-only modules, the new lib/db layer, and portable modules. Arrows carry import counts. One pair points both ways: components import lib/db five times and lib reaches up into components four times for the history format." width="900" height="432">
<style>
