<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1246 664" role="img" aria-label="Container view on this machine. Folders, git and logo images feed the crawler; the demo indexer feeds it from GitHub. Each writes an index file. The Next.js server reads the index through lib/data, which falls back to a database copy. The browser loads pages, posts each visit to /api/activity, asks for suggestions and logo images. The server appends visits to ~/.innernet/history and reads them into a PGlite database in ~/.innernet/db. Other apps may add their own files to the history, and the db commands work on the database when the server is stopped." width="1246" height="664">
