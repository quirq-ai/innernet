  .nd.hot, .file { stroke: #9db6ff; }
  .ln.nwl { stroke: #6fcf97; } .ahn, .nw, .nwt, .hd.nwt, .rt.nwt, tspan.nwt { fill: #6fcf97; }
  .ln.warnl { stroke: #f0955f; } .ahw, .warnT { fill: #f0955f; }
  .tr, .base, .mark60 { stroke: rgba(236,234,227,0.2); } .grid, .rule { stroke: rgba(236,234,227,0.09); }
  .nd { fill: #1a1a18; stroke: rgba(236,234,227,0.2); }
  .same { fill: #5e5a52; }
  .bar, .bar.other { fill: #4a4740; } .bar.hi { fill: #6f8ff0; } .bar.nwbar { fill: #3f9e6a; }
  .ln.s1 { stroke: #6f8ff0; } .ln.s2 { stroke: #d95926; }
  .dot.s1 { fill: #6f8ff0; stroke: #1a1a18; } .dot.s2 { fill: #d95926; stroke: #1a1a18; }
